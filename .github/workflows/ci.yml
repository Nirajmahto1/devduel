name: DevDuel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test-server:
    name: Server — Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: devduel_test
          POSTGRES_USER: devduel_user
          POSTGRES_PASSWORD: devduel_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devduel_user -d devduel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: devduel_test
          DB_USER: devduel_user
          DB_PASSWORD: devduel_secret
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret

