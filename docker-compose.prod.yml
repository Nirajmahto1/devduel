version: '3.8'

services:
  # ─── PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: devduel_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-devduel}
      POSTGRES_USER: ${DB_USER:-devduel_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-devduel_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - devduel_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-devduel_user} -d ${DB_NAME:-devduel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache & Queue ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devduel_redis_prod
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - devduel_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── DevDuel Backend API & WebSocket Server ───────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: devduel_server_prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-devduel}
      DB_USER: ${DB_USER:-devduel_user}
      DB_PASSWORD: ${DB_PASSWORD:-devduel_secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JUDGE0_URL: http://judge0_server:2358
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_secure_jwt_secret_key_in_prod}
      CLIENT_URL: ${CLIENT_URL:-https://devduel.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devduel_net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Nginx Reverse Proxy ──────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: devduel_nginx_prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./client/dist:/usr/share/nginx/html:ro
      - certbot_etc:/etc/letsencrypt
    depends_on:
      - server
    networks:
      - devduel_net

volumes:
  postgres_data:
  redis_data:
  certbot_etc:

networks:
  devduel_net:
    driver: bridge
